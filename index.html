<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payroll SQL Workbench</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--panel:#fff;--ink:#1c2230;--mute:#667085;--line:#e1e5ec;--acc:#2f6fed;--accink:#fff;--ok:#157f4b;--err:#c0352b;--chip:#eef2fb;--code:#f1f3f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--panel:#1a1f29;--ink:#e6e9f0;--mute:#8d96a8;--line:#2a3140;--acc:#5b8cff;--accink:#0c1020;--ok:#4cc38a;--err:#ff7a70;--chip:#222a3a;--code:#10141b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151c;--panel:#1a1f29;--ink:#e6e9f0;--mute:#8d96a8;--line:#2a3140;--acc:#5b8cff;--accink:#0c1020;--ok:#4cc38a;--err:#ff7a70;--chip:#222a3a;--code:#10141b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}header span{color:var(--mute);font-size:12px}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:14px;padding:14px;max-width:1300px;margin:auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 8px}
.tbl{margin-bottom:8px}.tbl b{cursor:pointer;color:var(--acc)}
.col{display:inline-block;margin:2px 3px 0 0;padding:1px 7px;border-radius:99px;background:var(--chip);font:12px ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
.col.fk{outline:1px dashed var(--acc)}
.side{display:flex;flex-direction:column;gap:14px}
.tpl{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 2px;color:var(--ink);font:inherit;cursor:pointer}
.tpl:hover{color:var(--acc)}.tpl small{display:block;color:var(--mute)}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.ed{position:relative}
textarea{width:100%;min-height:130px;resize:vertical;background:var(--code);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace}
textarea:focus{outline:2px solid var(--acc)}
.sug{position:absolute;left:10px;top:100%;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px #0003;min-width:220px;max-height:220px;overflow:auto;display:none}
.sug div{padding:4px 10px;font:12.5px ui-monospace,Menlo,monospace;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.sug div.on,.sug div:hover{background:var(--acc);color:var(--accink)}.sug i{opacity:.65;font-style:normal}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
button.run{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:8px 16px;font:600 14px inherit;cursor:pointer}
button.sec{background:var(--chip);color:var(--ink);border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.hint{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:12px;color:var(--mute)}
.hint button{background:var(--chip);color:var(--ink);border:1px dashed var(--acc);border-radius:99px;padding:2px 10px;font:12px ui-monospace,Menlo,monospace;cursor:pointer}
.msg{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:13px}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.msg.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.msg u{cursor:pointer;font-weight:600}
.res{overflow-x:auto;margin-top:10px;max-height:420px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--mute);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
kbd{background:var(--chip);border-radius:4px;padding:0 5px;font-size:11px}
</style>
</head>
<body>
<header><h1>Payroll SQL Workbench</h1><span>Type a query, get suggestions, see the data. Everything runs in your browser on sample data.</span></header>
<div class="wrap">
<div class="side">
 <div class="card"><h2>Tables (click to insert)</h2><div id="schema"></div></div>
 <div class="card"><h2>Ready-made queries</h2><div id="tpls"></div></div>
</div>
<div class="main">
 <div class="card">
  <h2>Query</h2>
  <div class="ed"><textarea id="q" spellcheck="false" placeholder="SELECT * FROM employee"></textarea><div class="sug" id="sug"></div></div>
  <div class="hint" id="joins"></div>
  <div class="bar"><button class="run" id="run">Run ▶</button><button class="sec" id="reset">Reset sample data</button><span style="color:var(--mute);font-size:12px"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> runs · <kbd>Tab</kbd> accepts a suggestion</span></div>
  <div id="msg"></div><div class="res" id="res"></div>
 </div>
</div>
</div>
<script src="data/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alasql@4.5.1/dist/alasql.min.js"></script>
<script>
const SCHEMA={
 department:{cols:['dept_id','dept_name','location']},
 grade:{cols:['grade_id','grade_name','basic_salary','bonus']},
 employee:{cols:['emp_id','full_name','email','role','dept_id','grade_id','manager_id','hire_date','status']},
 payroll:{cols:['pay_id','emp_id','pay_month','base_salary','bonus','overtime_pay','tax','net_pay','status']},
 attendance:{cols:['att_id','emp_id','pay_month','days_present','days_absent','overtime_hours']}
};
const FKS=[['employee','dept_id','department','dept_id'],['employee','grade_id','grade','grade_id'],['payroll','emp_id','employee','emp_id'],['attendance','emp_id','employee','emp_id']];
const KW=['SELECT','FROM','WHERE','JOIN','LEFT JOIN','ON','GROUP BY','ORDER BY','HAVING','LIMIT','AS','AND','OR','NOT','LIKE','IN','BETWEEN','DISTINCT','COUNT(','SUM(','AVG(','MAX(','MIN(','ROUND(','DESC','ASC','UPDATE','SET','DELETE FROM','INSERT INTO','VALUES','IS NULL','IS NOT NULL'];
const STOP=new Set('where left right inner join on group order by having limit and or not as set values select from desc asc'.split(' '));
const TEMPLATES=[
 ['All employees with department & grade','Three tables joined','SELECT e.emp_id, e.full_name, d.dept_name, g.grade_name, e.hire_date\nFROM employee e\nJOIN department d ON e.dept_id = d.dept_id\nJOIN grade g ON e.grade_id = g.grade_id\nORDER BY e.emp_id'],
 ['Headcount per department','GROUP BY + COUNT','SELECT d.dept_name, COUNT(*) AS headcount\nFROM employee e\nJOIN department d ON e.dept_id = d.dept_id\nGROUP BY d.dept_name\nORDER BY headcount DESC'],
 ['Payroll cost per department (latest month)','SUM of net pay','SELECT d.dept_name, SUM(p.net_pay) AS total_net_pay\nFROM payroll p\nJOIN employee e ON p.emp_id = e.emp_id\nJOIN department d ON e.dept_id = d.dept_id\nWHERE p.pay_month = \'2026-09\'\nGROUP BY d.dept_name\nORDER BY total_net_pay DESC'],
 ['Pay slip for one employee','Change the emp_id','SELECT e.full_name, p.pay_month, p.base_salary, p.bonus, p.overtime_pay, p.tax, p.net_pay\nFROM payroll p\nJOIN employee e ON p.emp_id = e.emp_id\nWHERE e.emp_id = 3\nORDER BY p.pay_month DESC'],
 ['Top 5 earners (net pay)','ORDER BY + LIMIT','SELECT e.full_name, p.pay_month, p.net_pay\nFROM payroll p\nJOIN employee e ON p.emp_id = e.emp_id\nORDER BY p.net_pay DESC\nLIMIT 5'],
 ['Average salary by grade','AVG + GROUP BY','SELECT g.grade_name, ROUND(AVG(p.net_pay)) AS avg_net\nFROM payroll p\nJOIN employee e ON p.emp_id = e.emp_id\nJOIN grade g ON e.grade_id = g.grade_id\nGROUP BY g.grade_name\nORDER BY g.grade_name'],
 ['Unpaid / pending payroll','Filter on status','SELECT e.full_name, p.pay_month, p.net_pay, p.status\nFROM payroll p\nJOIN employee e ON p.emp_id = e.emp_id\nWHERE p.status = \'Pending\''],
 ['Employees with most absences','Attendance + employee','SELECT e.full_name, SUM(a.days_absent) AS total_absent\nFROM attendance a\nJOIN employee e ON a.emp_id = e.emp_id\nGROUP BY e.full_name\nORDER BY total_absent DESC'],
 ['Employees and their managers','Self join','SELECT e.full_name AS employee, m.full_name AS manager\nFROM employee e\nLEFT JOIN employee m ON e.manager_id = m.emp_id'],
 ['Hired in the last 2 years','Date filter (text dates)','SELECT full_name, hire_date FROM employee\nWHERE hire_date >= \'2024-10-01\'\nORDER BY hire_date'],
 ['Search by name','LIKE','SELECT * FROM employee WHERE full_name LIKE \'%an%\''],
 ['Give Grade B a raise (UPDATE)','Changes data, use Reset to undo','UPDATE grade SET basic_salary = 4500 WHERE grade_name = \'B\'']
];
const $=id=>document.getElementById(id);
const q=$('q'),sug=$('sug');

function seed(){
 ['department','grade','employee','payroll','attendance'].forEach(n=>{try{alasql('DROP TABLE IF EXISTS '+n)}catch(e){};alasql('CREATE TABLE '+n);alasql.tables[n].data=JSON.parse(JSON.stringify(window.PAYROLL_DATA[n]))});
}

function renderSide(){
 $('schema').innerHTML=Object.entries(SCHEMA).map(([t,o])=>'<div class="tbl"><b data-ins="'+t+'">'+t+'</b><div>'+o.cols.map(c=>'<span class="col'+(c.endsWith('_id')&&c!=='pay_id'&&c!=='att_id'?' fk':'')+'" data-ins="'+c+'">'+c+'</span>').join('')+'</div></div>').join('');
 $('tpls').innerHTML=TEMPLATES.map((t,i)=>'<button class="tpl" data-t="'+i+'">'+t[0]+'<small>'+t[1]+'</small></button>').join('');
}
function insertText(s){const a=q.selectionStart,b=q.selectionEnd;q.value=q.value.slice(0,a)+s+q.value.slice(b);q.focus();q.selectionStart=q.selectionEnd=a+s.length;onEdit()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-ins]');if(t){insertText(t.dataset.ins+' ');return}
 const p=e.target.closest('[data-t]');if(p){q.value=TEMPLATES[p.dataset.t][2];onEdit();run();return}
 const j=e.target.closest('[data-join]');if(j){q.value=q.value.replace(/\s*$/,'')+'\n'+j.dataset.join+' ';q.focus();onEdit();return}
 const d=e.target.closest('[data-did]');if(d){q.value=q.value.replace(new RegExp('\\b'+d.dataset.bad+'\\b','gi'),d.dataset.did);onEdit();return}
 if(!e.target.closest('.ed'))sug.style.display='none';
});

function aliasMap(sql){
 const m={},re=/\b(?:from|join)\s+(\w+)(?:\s+(?:as\s+)?(\w+))?/gi;let x;
 while((x=re.exec(sql))){const t=x[1].toLowerCase();if(!SCHEMA[t])continue;m[t]=t;if(x[2]&&!STOP.has(x[2].toLowerCase()))m[x[2].toLowerCase()]=t}
 return m;
}
let items=[],sel=0;
function suggest(){
 const pos=q.selectionStart,before=q.value.slice(0,pos),w=(before.match(/[\w.]*$/)||[''])[0];
 if(!w){sug.style.display='none';return}
 const am=aliasMap(q.value);let list=[];
 if(w.includes('.')){
  const [a,c]=w.split('.');const t=am[a.toLowerCase()];
  if(t)list=SCHEMA[t].cols.filter(x=>x.startsWith(c.toLowerCase())).map(x=>[a+'.'+x,t]);
 }else{
  const lw=w.toLowerCase(),seen=new Set();
  Object.keys(SCHEMA).forEach(t=>{if(t.startsWith(lw))list.push([t,'table'])});
  Object.entries(SCHEMA).forEach(([t,o])=>o.cols.forEach(c=>{if(c.startsWith(lw)&&!seen.has(c)){seen.add(c);list.push([c,'column'])}}));
  KW.forEach(k=>{if(k.toLowerCase().startsWith(lw)&&lw.length>0)list.push([k,'keyword'])});
  Object.keys(am).forEach(a=>{if(a.startsWith(lw)&&!SCHEMA[a])list.push([a,'alias of '+am[a]])});
 }
 list=list.filter(x=>x[0].toLowerCase()!==w.toLowerCase()).slice(0,8);
 items=list;sel=0;
 if(!list.length){sug.style.display='none';return}
 sug.innerHTML=list.map((x,i)=>'<div data-i="'+i+'" class="'+(i?'':'on')+'">'+x[0]+'<i>'+x[1]+'</i></div>').join('');
 sug.style.display='block';
}
function accept(i){
 const pos=q.selectionStart,before=q.value.slice(0,pos),w=(before.match(/[\w.]*$/)||[''])[0],it=items[i][0];
 q.value=before.slice(0,pos-w.length)+it+' '+q.value.slice(pos);
 q.selectionStart=q.selectionEnd=pos-w.length+it.length+1;sug.style.display='none';onEdit(true);
}
sug.addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();accept(+d.dataset.i)}});
q.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run();return}
 if(sug.style.display==='block'){
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:items.length-1))%items.length;[...sug.children].forEach((c,i)=>c.classList.toggle('on',i===sel))}
  else if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();accept(sel)}
  else if(e.key==='Escape')sug.style.display='none';
 }
});
function onEdit(skip){if(!skip)suggest();joinHints()}
q.addEventListener('input',()=>onEdit());
q.addEventListener('click',()=>{sug.style.display='none'});

function joinHints(){
 const am=aliasMap(q.value),present={};Object.entries(am).forEach(([a,t])=>{if(!present[t])present[t]=a});
 const out=[];
 FKS.forEach(([a,ac,b,bc])=>{
  if(present[a]&&!present[b])out.push('JOIN '+b+' '+b[0]+' ON '+present[a]+'.'+ac+' = '+b[0]+'.'+bc);
  else if(present[b]&&!present[a])out.push('JOIN '+a+' '+a[0]+' ON '+a[0]+'.'+ac+' = '+present[b]+'.'+bc);
 });
 const u=[...new Set(out)].slice(0,5);
 $('joins').innerHTML=u.length?'Join suggestions: '+u.map(s=>'<button data-join="'+s+'">'+s+'</button>').join(''):(Object.keys(present).length?'':'Tip: start with <b>SELECT * FROM employee</b>, then add JOINs from the suggestions here.');
}

function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i]}for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function typos(sql){
 const am=aliasMap(sql),known=new Set([...Object.keys(SCHEMA),...Object.keys(am)]);
 Object.values(SCHEMA).forEach(o=>o.cols.forEach(c=>known.add(c)));
 const kw=new Set(KW.join(' ').toLowerCase().replace(/[()]/g,'').split(' ').concat([...STOP,'count','sum','avg','max','min','round','null','is','inner','outer','into','delete','insert','update','distinct','between','like','in']));
 const clean=sql.replace(/'[^']*'/g,"''"),found=[],seen=new Set();
 (clean.match(/[A-Za-z_]\w*/g)||[]).forEach(w=>{
  const l=w.toLowerCase();if(known.has(l)||kw.has(l)||seen.has(l))return;seen.add(l);
  let best=null,bd=3;[...known,...kw].forEach(k=>{if(k.length<3)return;const d=lev(l,k);if(d<bd){bd=d;best=k}});
  found.push([w,best]);
 });
 return found;
}
function checkJoin(sql){
 const am=aliasMap(sql);
 const hasJoin=/\bjoin\b/i.test(sql),hasOn=/\bon\b/i.test(sql);
 if(hasJoin&&!hasOn)return 'You used JOIN without ON. Add the matching ID columns, e.g. JOIN department d ON e.dept_id = d.dept_id.';
 const n=Object.values(am).length;
 if(/\bfrom\s+\w+(\s+\w+)?\s*,\s*\w+/i.test(sql))return 'Comma-separated tables with no condition give every row × every row. Prefer JOIN ... ON.';
 return '';
}

function fmt(v,k){return v===null||v===undefined?'<span style="color:var(--mute)">NULL</span>':String(v).replace(/</g,'&lt;')}
function run(){
 sug.style.display='none';
 const sql=q.value.trim(),msg=$('msg'),res=$('res');
 if(!sql){msg.innerHTML='<div class="msg err">Write a query first, or pick one from the ready-made list.</div>';res.innerHTML='';return}
 const stmts=sql.split(';').map(s=>s.trim()).filter(Boolean);let last,t0=performance.now();
 try{
  if(typeof alasql==='undefined')throw new Error('SQL engine failed to load.');
  const tp=typos(sql).filter(x=>x[1]);
  const risky=/\b(delete|update)\b/i.test(sql)&&!/\bwhere\b/i.test(sql);
  if(risky){msg.innerHTML='<div class="msg err">This UPDATE/DELETE has no WHERE, so it would change <b>every row</b>. Add a WHERE condition.</div>';res.innerHTML='';return}
  for(const s of stmts){last=alasql(s)}
  const ms=(performance.now()-t0).toFixed(1);
  const warn=checkJoin(sql);
  if(Array.isArray(last)){
   if(!last.length){res.innerHTML='';msg.innerHTML='<div class="msg ok">Query ran, but 0 rows matched.</div>';}
   else{
    const cols=Object.keys(last[0]);
    res.innerHTML='<table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+last.map(r=>'<tr>'+cols.map(c=>'<td'+(typeof r[c]==='number'?' class="n"':'')+'>'+fmt(r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    msg.innerHTML='<div class="msg ok">'+last.length+' row'+(last.length>1?'s':'')+' · '+ms+' ms</div>';
   }
  }else{res.innerHTML='';msg.innerHTML='<div class="msg ok">Done. '+(typeof last==='number'?last+' row(s) affected.':'')+' Run a SELECT to see the change.</div>'}
  if(warn)msg.innerHTML+='<div class="msg err">Heads up: '+warn+'</div>';
 }catch(err){
  res.innerHTML='';
  const tp=typos(sql).filter(x=>x[1]);
  let h='<div class="msg err"><b>Could not run this query.</b><br>'+String(err.message||err).split('\n')[0].replace(/</g,'&lt;');
  if(tp.length)h+='<br>Possible typos: '+tp.map(([b,g])=>'<u data-bad="'+b+'" data-did="'+g+'">'+b+' → '+g+'</u>').join(', ')+' (click to fix)';
  else h+='<br>Check commas between columns, quotes around text (\'Paid\'), and that every table is in FROM or JOIN.';
  msg.innerHTML=h+'</div>';
 }
}
$('run').onclick=run;
$('reset').onclick=()=>{seed();$('msg').innerHTML='<div class="msg ok">Sample data restored.</div>';$('res').innerHTML=''};
renderSide();
try{seed()}catch(e){$('msg').innerHTML='<div class="msg err">SQL engine failed to load. Check your connection and reload.</div>'}
q.value=TEMPLATES[0][2];joinHints();
if(typeof alasql!=='undefined')run();
</script>
</body>
</html>
